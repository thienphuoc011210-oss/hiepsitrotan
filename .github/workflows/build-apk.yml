name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tao thu muc www
        run: |
          mkdir -p www
          cp index.html icon-192.png icon-512.png www/
      - run: npm install
      - run: npx cap add android
      - name: Man hinh ngang
        run: |
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hiep-Si-Tro-Tan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
